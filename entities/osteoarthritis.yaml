  prevalence:
    value: 5.95e8
    units: >
      people, roughly 7.6% of the world — **and this figure rose by something like
      seventy percent in a single GBD revision because the case definition was
      broadened to include hand and other joints, not because more knees wore
      out.** The earlier headline was around 344 million. Knee is the largest
      single site, then hand, then hip
    src: recall
  ylds:
    value: 2.2e7
    units: >
      YLD/year — consistently among the top handful of causes of years lived with
      disability worldwide, and rising faster than almost anything else in the
      table because it is driven by two things that are both increasing, age and
      body weight
    src: recall
  deaths:
    value: 0.0
    units: >
      deaths/year attributed — **and unlike `hearing-loss`, where the zero is close
      to literal, this one is an accounting choice.** NSAID gastrointestinal
      bleeding kills, opioids prescribed for joint pain kill, and the
      cardiovascular consequences of years of enforced inactivity kill. Every one
      of those deaths is attributed to another cause
    src: reasoning
  note: >
    **THE SECOND-LARGEST DISABILITY RECORD IN THIS REGISTER, BEHIND ITS OWN
    CONTRAST CASE.** `low-back-pain` carries roughly 60 million YLD and this
    carries roughly 22 million; between them they are the two largest causes of
    disability on earth, they are both musculoskeletal, and **one of them has a
    definitive cure and the other has nothing.** The variable is not effort or
    money. It is whether there is a part you can point at and remove.

axes:
  mechanism: partial
  intervention: curative
  prevention: risk-reduction
  ongoing: moderate
  efficacy:
    value: 0.55
    units: >
      fraction-of-patients (durable, clinically meaningful relief from the best
      available treatment for their joint) — **a blend of two very different
      numbers**: around 0.85-0.90 for end-stage hip and knee reaching
      arthroplasty, and around 0.30 for everyone whose joint is not replaceable or
      not yet bad enough, which is most people most of the time
    src: reasoning
  access:
    value: 0.25
    units: >
      fraction-of-patients (able to obtain the definitive operation when
