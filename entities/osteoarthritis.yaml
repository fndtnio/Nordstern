slug: osteoarthritis
id: FND-D-0096
name: osteoarthritis
also: [OA, degenerative joint disease, knee osteoarthritis, hip osteoarthritis, gonarthrosis, coxarthrosis]
mondo: MONDO:0005178
kind: disease
residual: false
contested: true

# THE CONTRAST CASE `low-back-pain` HAS BEEN WAITING FOR SINCE RECORD 10, and it
# separates on exactly one variable. Both are enormous, degenerative,
# musculoskeletal, painful, and old. Low back pain rates `mechanism: none`
# because there is nothing to point at. **Here there is a joint, you can see it,
# you can grade it on a plain radiograph — and the pain still does not follow
# it.** The discordance survives having a mechanism, which is the finding.
#
# AND IT IS THE REGISTER'S SHARPEST CASE OF A CURE THAT IS NOT A TREATMENT.
# There is no drug in history that alters the course of osteoarthritis — forty
# years, dozens of phase 3 programmes, zero approvals. What exists instead is an
# operation that removes the joint and installs a machine, and it is one of the
# most successful things medicine does. **The disease is not cured. The organ is
# replaced** (gaps.md #202).
#
# The prosthesis has a service life of roughly twenty to twenty-five years, and
# that single engineering fact propagates into the clinic in a way no axis here
# can hold: it decides whether the operation is curative (it depends on the
# patient's age), and it sets a **lower bound** on treatment — you are made to
# wait until the joint is destroyed (gaps.md #203).

