      and near zero across most of the world, where joint replacement is not a
      service that exists
    src: reasoning

measurement:
  diagnostic: objective
  prognostic: partial
  predictive: none
  witness: >
    **DIAGNOSTIC IS `objective` AND THAT RATING IS ACCURATE AND ALMOST ENTIRELY
    BESIDE THE POINT.** A plain radiograph shows joint space narrowing,
    osteophytes, subchondral sclerosis and cysts, and the Kellgren-Lawrence grade
    has been a reproducible five-point scale since 1957. It is cheap, it is
    available nearly everywhere, and it grades the joint precisely.
    **It does not grade the patient.** A large fraction of people with severe
    radiographic changes have no pain, and a large fraction of people disabled by
    joint pain have unremarkable films. This is `low-back-pain`'s central problem
    appearing in a record where the mechanism is *not* missing — so the
    discordance cannot be explained away as "we have not found the lesion yet".
    **The lesion is right there and it does not predict the illness.**
    The practical consequence is that clinical guidelines now say imaging is not
    required to diagnose osteoarthritis, which is a field quietly conceding that
    its objective test measures the wrong variable.
    PROGNOSTIC is `partial`. Some knees are radiographically stable for twenty
    years and some destroy themselves in three, and malalignment, obesity, bone
    marrow lesions and baseline severity all shift the odds at population level.
    **None of them tells the person in front of you which kind of knee they
    have**, which is the question they are asking.
    **PREDICTIVE IS `none`, AND THE MISSING TEST IS AN EXPENSIVE ONE.** Nothing
    predicts who responds to which analgesic, who benefits from physiotherapy, or
    which of the many phenotypes a given patient has. And most consequentially:
    **roughly one in five people is dissatisfied after a technically successful
    knee replacement** — a well-fitted implant, a clean radiograph, and persistent
    pain — and there is no way to identify them beforehand. That is a permanent,
    irreversible, expensive intervention delivered to people who cannot be told
    their odds.

toll:
  severity: major
  permanent: true
  what: >
    **THE DRUGS AND THE OPERATION CHARGE SEPARATELY, AND THE DRUGS CHARGE MORE IN
    TOTAL BECAUSE THE DENOMINATOR IS HUNDREDS OF MILLIONS.**
    **NSAIDs** are the mainstay and they are not benign at the doses and durations
    osteoarthritis requires: gastrointestinal bleeding, renal impairment,
    hypertension, and an increased cardiovascular event rate for most of the
    class. Taken daily for a decade by an elderly population with comorbidities,
    they produce a steady, diffuse, entirely predictable stream of harm that is
    nobody's decision — the same accumulating structure `copd` records for
    corticosteroid courses (gaps.md #98's neighbourhood).
    **Opioids** were prescribed heavily for joint pain, are recommended against on
    both efficacy and harm grounds, and were a principal channel of the opioid
    crisis second only to back pain. `low-back-pain` carries that toll explicitly
    and this record carries the rest of it.
    **Intra-articular corticosteroid injections** relieve pain for weeks and there
    is evidence that repeated injections accelerate cartilage loss — a treatment
    that trades the symptom against the disease.
    **Arthroplasty's toll is smaller in incidence and far worse in kind.**
    Periprosthetic joint infection occurs in roughly one percent and is a
    catastrophe: staged revision, months of antibiotics, sometimes a fused joint
    or an amputation. Venous thromboembolism, periprosthetic fracture, nerve
    injury, and **persistent post-surgical pain in a joint that looks perfect**.
    **And the revision itself is a toll the schema files nowhere.** A second
    operation on the same joint gives worse function, higher infection risk and a
    shorter-lived implant than the first, and a third is worse again — so the
    price of having the operation young is charged twenty years later
    (gaps.md #202).
  incidence:
    value: 0.06
    units: >
      fraction-of-treated (persistent harm — chiefly NSAID gastrointestinal,
      renal and cardiovascular events over years of use, plus prosthetic
      infection and chronic post-surgical pain) — a reasoned estimate
    src: reasoning

residue:
  severity: major
  permanent: true
  what: >
    **THE JOINT CAN BE REPLACED. THE DECADE SPENT NOT WALKING CANNOT.**
    People typically live with disabling hip or knee osteoarthritis for years
    before they are considered bad enough to operate on — see `window`, because
    that delay is deliberate — and that period is not neutral. Quadriceps and
    gluteal muscle is lost and does not fully return; gait compensations load the
    other knee, the back and the opposite hip, which is a documented route by
    which one joint's disease becomes another's; body weight rises because
    exercise has become painful, which feeds the strongest modifiable cause of the
    disease back into itself; and cardiovascular fitness declines in a population
    that is already elderly.
    **The inactivity is the part with a body count.** Osteoarthritis is a
    documented contributor to cardiovascular mortality through enforced physical
    inactivity, and every one of those deaths is attributed to the heart. A
    successful joint replacement at seventy-two restores the joint to someone who
    has already spent eight years becoming deconditioned, and the function they
    recover is bounded by that.
    Note what this is *not*. The destroyed cartilage is not residue — it is the
    disease, still doing it, which is `copd`'s exact shape and gaps.md #97. What
    is recorded here is the damage the disease did **elsewhere in the body** while
    everyone waited, and which persists after the treatment worked.
  incidence:
    value: 0.20
    units: >
      fraction-of-affected (permanent deconditioning, muscle loss, weight gain or
      secondary joint loading persisting after definitive treatment) — a reasoned
      estimate
    src: reasoning

window:
  what: >
    **THIS RECORD'S TREATMENT WINDOW HAS A LOWER BOUND RATHER THAN AN UPPER ONE,
    AND EVERY OTHER WINDOW IN THIS REGISTER IS ABOUT BEING LATE** (gaps.md #203).
    You are not offered a joint replacement when your knee starts to hurt. You are
    offered it when the joint is destroyed, the pain is constant, and everything
    else has failed — and **that is not rationing, it is clinically correct**,
    because the implant has a service life of roughly twenty to twenty-five years
    and a revision is a worse operation than the original. Replacing a knee at
    fifty commits the patient to at least one revision, and possibly two. So the
    surgeon's advice is to wait, and waiting is the `residue` above.
    **The threshold is set by the hardware, not by the patient's suffering**, and
    it moves as implants improve. It is the mirror image of `congenital-heart-
    disease`'s Eisenmenger inversion (gaps.md #199): there the intervention becomes
    harmful after a point; here it is harmful before one.
    **The prevention window is a different thing entirely and it closes decades
    before the disease exists.** Roughly half of people who rupture an anterior
    cruciate ligament or tear a meniscus have radiographic osteoarthritis of that
    knee within ten to twenty years, and **reconstructing the ligament does not
    appear to prevent it** — the injury is diagnosed, treated, treated well by the
    endpoints the operation was designed around, and the outcome that matters
    arrives fifteen years after anyone stopped following the patient. The other
    half of the prevention window is the years of weight gain, which belongs to
    `obesity` and is charged to nobody.
  closes_on: >
    nothing, in the usual sense — the treatment window **opens** late and stays
    open, and what closes is the prevention window at the moment of a joint
    injury or during the years of weight gain, decades before any joint hurts
  caught_in_time:
    value: 0.35
    units: >
      fraction-of-cases (reaching definitive treatment while still able to
      recover function, or having the causative injury or weight trajectory
      addressed) — a reasoned estimate, and it is generous
    src: reasoning

strata:
