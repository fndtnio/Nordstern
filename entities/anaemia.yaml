# THE LARGEST PREVALENCE FIGURE IN THIS REGISTER — ROUGHLY ONE PERSON IN FOUR
# ALIVE — AND IT IS NOT A DISEASE. IT IS A LABORATORY VALUE.
#
# `kind: syndrome` is the least wrong of the three available and none of them
# fits. Anaemia is a **sign**: a haemoglobin concentration below a threshold,
# produced by dozens of causes, and **most of those causes are already rows in
# this register** — sickle-cell, malaria, soil-transmitted-helminths,
# schistosomiasis, chronic-kidney-disease, colorectal-cancer, h-pylori-ulcer,
# tuberculosis, hiv. This is gaps.md #39's fourth and most extreme record, and the
# thing that makes it extreme is that the components are not unnamed mechanisms;
# they are entities the corpus has already rated separately.
#
# TWO NEW GAPS CAME OUT OF IT AND BOTH ARE ABOUT THE MACHINERY RATHER THAN THE
# BIOLOGY. **The threshold that defines the disease was derived from reference
# populations that were themselves widely iron-deficient** (gaps.md #206) — a
# normal range that encodes the disease as normal. And **the best intervention in
# the record is delivered to a population containing no patients**: flour
# fortification reaches people who are never diagnosed, never prescribed to, and
# never know they were treated, which `access` cannot express (gaps.md #207).
#
# It also closes the disability block honestly. `hearing-loss`, `cataract` and
# `osteoarthritis` read `deaths: 0` and mean it. **Anaemia reads `deaths: 0` and
# does not** — it is a multiplier on other records' mortality, and the deaths are
# filed under the haemorrhage, the malaria episode and the operation.

burden:
  prevalence:
    value: 1.92e9
    units: >
      people — **roughly a quarter of everyone alive, and by a wide margin the
      largest figure in this register.** Concentrated in women of reproductive
      age, pregnant women and young children in South Asia and sub-Saharan
      Africa, where prevalence in those groups commonly exceeds forty percent
    src: recall
  ylds:
    value: 5.0e7
    units: >
      YLD/year, approximately — **among the top few causes of years lived with
      disability worldwide**, and one that almost never appears in a discussion of
      what medicine should work on next
    src: recall
  deaths:
    value: 0.0
    units: >
      deaths/year attributed — **and this zero is a third distinct kind, after
      `hearing-loss`'s literal one and `osteoarthritis`'s accounting one.**
      Anaemia's contribution to mortality is **multiplicative**: it does not kill,
      it makes other things lethal. An anaemic woman who bleeds after delivery
      dies at a lower blood loss, and that death is filed under
      `maternal-haemorrhage`. A severely anaemic child with malaria dies of
      malaria. A patient anaemic before surgery has a worse operation. **Every
      such death is in another record, correctly, and nothing in the schema can
      say this record helped cause it** (gaps.md #179, #182)
    src: reasoning
  note: >
    **THE LARGEST TREATABLE THING IN THE REGISTER, AND ALMOST NOBODY'S JOB.** The
    commonest cause is iron deficiency; the treatment is ferrous sulphate, which
    is among the cheapest medicines that exist; and roughly two billion people
    have it. It is diagnosed by a test costing about a dollar. **This is
    gaps.md #48's other half** — not a disease whose burden is invisible because
    it is disability rather than death, but one whose burden is invisible because
    it has been distributed across every other record in the corpus.

