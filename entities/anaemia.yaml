measurement:
  diagnostic: objective
  prognostic: partial
  predictive: partial
  witness: >
    **THE TEST FOR THE DISEASE COSTS A DOLLAR AND THE TEST FOR ITS CAUSE IS
    BROKEN IN EXACTLY THE POPULATION THAT HAS IT.**
    Haemoglobin is measured on a drop of capillary blood by a hand-held device in
    under a minute, needs no laboratory and no cold chain, and is as `objective`
    as anything in this register. **That is the whole of the good news, because
    haemoglobin tells you the person is anaemic and nothing about why**, and the
    treatment depends entirely on why.
    **Ferritin is the test for iron deficiency and ferritin is an acute-phase
    reactant.** It rises with infection and inflammation, so in populations with
    high burdens of malaria, helminths, tuberculosis and chronic infection —
    which is precisely where anaemia is commonest — **a normal ferritin does not
    exclude iron deficiency.** Correction factors using C-reactive protein exist,
    require a second test, and are approximations. This is gaps.md #175's shape
    with a different cause and the same direction of effect: the instrument
    degrades where the disease concentrates, and it degrades toward
    **undertreating the poorest.**
    **And the threshold itself is contested — see `witness.contested`.** The
    haemoglobin cut-offs were set decades ago from reference populations that
    were small, non-representative, and quite possibly iron-deficient themselves
    (gaps.md #206). They were revised in 2024. A prevalence of two billion is a
    count of people on one side of a line whose position has moved within the
    last two years.
    PROGNOSTIC is `partial`. Severity bands predict transfusion need and
    perioperative risk reasonably. What is poorly predicted is **who will be
    harmed by their anaemia**, which matters because most of the two billion are
    mildly anaemic and asymptomatic, and the burden figure treats them all alike.
    PREDICTIVE is `partial`. Ferritin and transferrin saturation identify who will
    respond to iron, when they can be trusted. Nothing predicts who will tolerate
    oral iron, which decides the outcome as often as biology does.

toll:
  severity: minor
  permanent: false
  what: >
    **THE TREATMENT IS ONE OF THE SAFEST IN THE REGISTER AND IT HAS ONE
    SPECTACULAR EXCEPTION.**
    Oral iron causes nausea, constipation, abdominal pain and black stools in a
    large minority — trivial as harm, decisive as an obstacle, and the reason the
    `adherence` blocker exists. Intravenous iron is now safe enough for routine
    outpatient use, with rare hypersensitivity reactions and a
    formulation-dependent transient hypophosphataemia. Transfusion carries the
    usual risks and, given repeatedly, **iron overload**, which is a genuine
    permanent toll concentrated in the transfusion-dependent inherited stratum.
    **THE EXCEPTION IS IRON IN A HIGH-MALARIA SETTING.** A large trial of routine
    iron and folic acid supplementation in children in a malaria-endemic area was
    stopped early because supplemented children had **more serious adverse events
    and more deaths**, and the finding changed global policy: universal iron
    supplementation is not recommended where malaria transmission is intense
    without malaria control alongside it. The mechanism is contested and the
    result is not.
    **That is gaps.md #157 in its clearest form** — an intervention whose effect
    has a *sign*, and the sign flips depending on which other record in this
    register the patient also has. A cheap tablet that prevents disability in one
    setting kills children in another, and nothing in the schema can hold a
    conditional like that.
  incidence:
    value: 0.01
    units: >
      fraction-of-treated (serious or permanent harm — chiefly transfusional iron
      overload in the inherited stratum, and the malaria-setting risk where
      supplementation is given without malaria control) — a reasoned estimate
    src: reasoning

residue:
  severity: major
  permanent: true
  what: >
    **THE DAMAGE IS DONE TO A DEVELOPING BRAIN AND CORRECTING THE HAEMOGLOBIN
    DOES NOT UNDO IT.**
    Iron is required for myelination, for monoamine neurotransmitter synthesis and
    for hippocampal development, and the demand peaks in the first two years of
    life. Iron deficiency during that period is associated with lasting deficits
    in cognition, motor development and behaviour, **and the observational
    evidence is that iron repletion afterwards does not fully reverse them.** The
    child's blood count normalises; the developmental trajectory does not return
    to where it would have been.
    **In pregnancy the residue lands in a second person.** Maternal anaemia is
    associated with low birth weight, preterm birth and impaired infant iron
    stores — so an untreated deficiency in a mother becomes a deficiency in an
    infant during exactly the window above, which is a two-generation loop the
    register has no way to draw.
    **State the honest qualification, because this record's importance rests on
    it.** Almost all of this is association rather than trial evidence. The
    correlations are large and consistent and confounded by everything that
    accompanies childhood iron deficiency — poverty, infection, malnutrition,
    education — and supplementation trials measuring cognitive outcomes have been
    inconsistent. **See the `knowledge` blocker**, which exists so that this
    record does not quietly become advocacy.
  incidence:
    value: 0.10
    units: >
      fraction-of-affected (permanent cognitive, motor or developmental deficit
      attributable to iron deficiency during early brain development, or to
      transfusional iron overload) — a reasoned estimate, and see the caveat above
    src: reasoning

window:
  what: >
    **THE FIRST THOUSAND DAYS, AND IT IS THE ONLY WINDOW IN THIS REGISTER WHERE
    THE INTERVENTION IS FOOD.**
    Brain iron demand peaks during gestation and the first two years. Deficiency
    during that period is the `residue` above; the same deficiency at thirty is
    fatigue and is fully reversible. **So the identical laboratory value carries a
    permanent price in one patient and none in another, and the variable is age.**
    That is the same shape `osteoarthritis` forced two records ago from the other
    direction — an axis that ought to be a function of age and is not
    (gaps.md #202).
    The interventions that fit inside the window are unusually cheap and
    unusually unglamorous: iron and folic acid in pregnancy, **delayed cord
    clamping**, which costs nothing at all and raises an infant's iron stores for
    months, exclusive breastfeeding followed by iron-adequate complementary food,
    fortified staples, and deworming and malaria control where those are the
    cause.
    **A second window closes on the acute end.** Severe anaemia in a child with
    malaria, or a bleeding patient, needs blood within hours, and the constraint
    there is a functioning transfusion service rather than a diagnosis — which is
    `maternal-haemorrhage`'s constraint, in a record that is one of the reasons
    that haemorrhage is fatal.
  closes_on: >
    the completion of early brain development — roughly the first two years, and
    gestation before it — after which a deficit is not recovered by correcting the
    haemoglobin; and separately, hours, in severe anaemia with acute blood loss or
    malaria
  caught_in_time:
    value: 0.40
    units: >
      fraction-of-cases (iron adequacy maintained through gestation and early
      childhood, or severe acute anaemia reaching transfusion in time) — a
      reasoned estimate
    src: reasoning

strata:
  - name: iron and other nutritional deficiency
    fraction:
      value: 0.55
      units: fraction-of-people-with-anaemia
      src: reasoning
    intervention: curative
    efficacy:
      value: 0.90
      units: fraction-of-stratum (corrected by iron, B12 or folate replacement)
      src: reasoning
    toll: minor
    what: >
      **The largest stratum and one of the most completely solved problems in
      medicine, biologically.** Ferrous sulphate is pennies, works in weeks, and
      pernicious anaemia — universally fatal within living memory — is now a
      three-monthly injection. **Everything that remains is diagnosis, supply and
      tolerability**, and the ongoing cause matters more than the deficiency: iron
      given to a woman with heavy menstrual bleeding or a man with a colonic
      tumour corrects a number and treats nothing.

  - name: anaemia of inflammation and chronic disease
    fraction:
      value: 0.20
      units: fraction-of-people-with-anaemia
      src: reasoning
    intervention: symptomatic
    efficacy:
      value: 0.40
      units: fraction-of-stratum (meaningful correction without treating the underlying disease)
      src: reasoning
    toll: minor
    what: >
      **The stratum where iron does not work, and since 2001 we know exactly
      why.** Inflammation raises hepcidin, hepcidin degrades ferroportin, and iron
      is locked inside macrophages and enterocytes where the marrow cannot reach
      it — so oral iron is absorbed poorly and does not correct the anaemia.
      Includes the anaemia of `chronic-kidney-disease`, of cancer, of
      `rheumatoid-arthritis`, of chronic infection. **Erythropoiesis-stimulating
      agents and the HIF prolyl-hydroxylase inhibitors treat it and carry
      cardiovascular risk**, and the real treatment is the underlying disease,
      which is another record.

  - name: infection-driven — malaria, hookworm, schistosomiasis
    fraction:
      value: 0.15
      units: fraction-of-people-with-anaemia
      src: reasoning
    intervention: curative
    efficacy:
      value: 0.85
      units: fraction-of-stratum (resolved by treating the infection)
      src: reasoning
    toll: minor
    what: >
      **Every entity in this stratum's name is already a record in this
      register**, each with its own `capability`, `access` and blockers — and this
