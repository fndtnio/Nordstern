# THE RECORD THE QUEUE SAVED FOR LAST BECAUSE IT BREAKS THE SCHEMA ON PURPOSE,
# AND IT BREAKS IT IN A WAY NEITHER OF THE TWO EXISTING GAPS PREDICTED.
#
# Cerebral palsy is defined as **non-progressive**. A lesion occurred once, in a
# developing brain, before or around birth, and it is finished. Everything the
# person lives with afterwards is consequence.
#
# gaps.md #97 (`copd`) says the register cannot hold permanent damage that IS the
# disease still doing it. gaps.md #60 (`lymphatic-filariasis`) says a residue can
# be the treatable part and `residue` has no capability of its own — and it asked
# for a second forcing record. **This is that record and it is the extreme
# form: the entity IS the residue** (gaps.md #208). The disease is over. The
# patient is not, for another seventy years.
#
# So the axes describe an event in the past. `mechanism: established` is a
# statement about something that happened in 1998 and cannot be reached.
# `intervention: symptomatic` is true of the entity and says nothing about the
# person, for whom a great deal can be done. **The derived verdict will read
# "engineering problem — understood, and nothing can be done", and it is
# simultaneously correct and one of the most misleading sentences this register
# can produce.**
#
# AND THE SECOND GAP IS WORSE. A large share of people with cerebral palsy cannot
# speak reliably or point reliably, and are therefore assessed with instruments
# that require speaking and pointing. **The measurement that is wrong here is the
# measurement of the person, not of the disease**, and every field in the
# `measurement` block is about the disease (gaps.md #209).

burden:
  prevalence:
    value: 1.7e7
    units: >
      people living with cerebral palsy worldwide — **the commonest physical
      disability of childhood**, at roughly 2 per 1,000 live births in
      high-income countries and higher elsewhere. **Most of them are adults**,
      which is the fact the field is organised as though it did not know
    src: recall
  deaths:
    value: 0.0
    units: >
      deaths/year attributed — **the fourth kind of zero in five records, and it
      is `osteoarthritis`'s kind rather than `anaemia`'s.** Life expectancy is
      near-normal in the mildly affected and substantially reduced at the severe
      end, where death is usually from aspiration pneumonia, and **is filed as
      pneumonia**. The deaths are real, they are concentrated, and they belong to
      another record's tally
    src: reasoning
  note: >
    **A RECORD WHOSE INCIDENCE HAS BARELY MOVED IN FIFTY YEARS, FOR AN
    UNCOMFORTABLE REASON.** Neonatal intensive care saves extremely preterm
    infants who would previously have died, and a fraction of the survivors have
    cerebral palsy — so improving obstetric and neonatal care has pushed the rate
    down through some routes and up through others, roughly cancelling.
    **gaps.md #147 in its gentlest form**: part of this record exists because
    medicine got good enough, and nothing says so.

axes:
  mechanism: established
  intervention: symptomatic
  prevention: risk-reduction
  ongoing: high
  efficacy:
    value: 0.55
    units: >
      fraction-of-patients (meaningful, sustained improvement in function,
      participation or comfort from best-available management) — **and it is the
      most strained efficacy figure in the register**, because the outcome is not
      a disease endpoint. Nothing here alters the lesion; the number describes
      whether the person's life went better
    src: reasoning
  access:
    value: 0.20
    units: >
      fraction-of-patients (receiving adequate therapy, equipment,
      communication support, orthopaedic and hip surveillance, and education) —
      low nearly everywhere, near zero across most of the world, **and it falls
      off a cliff at eighteen even in the richest systems**
    src: reasoning

measurement:
  diagnostic: clinical
  prognostic: good
  predictive: none
  witness: >
    **DIAGNOSTIC IS `clinical` AND THE INTERESTING THING IS THAT IT RECENTLY
    STOPPED HAVING TO BE LATE.**
    There is no test for cerebral palsy. It is a clinical description — a
    persistent disorder of movement and posture attributed to a non-progressive
    disturbance in the developing brain — supported by MRI, which shows a
    consistent lesion in the large majority and is corroboration rather than
    criterion. **For decades the average age at diagnosis was around nineteen
    months**, because clinicians waited for motor milestones to fail.
    **That changed, and the change has not been implemented.** The General
    Movements Assessment and the Hammersmith Infant Neurological Examination,
    combined with MRI, identify infants at high risk **by three to six months** —
    which matters enormously, because the intervention window is the period of
    peak neuroplasticity that the old timeline spent waiting. A diagnostic
    capability that moves an intervention inside its window is the cheapest kind
    of progress there is, and this one is sitting mostly unused.
    PROGNOSTIC is `good`, and unusually so for this register. The Gross Motor
    Function Classification System, applied by about age two, predicts motor
    trajectory over decades with genuine reliability — **a five-level ordinal
    scale, free, requiring no equipment, and one of the best prognostic
    instruments in medicine.** A family can be told, honestly and early, roughly
    what to expect. That is worth more than most of the tests in this corpus.
    PREDICTIVE is `none`, and it is expensive. Nothing predicts which child will
    respond to which therapy, which will benefit from selective dorsal rhizotomy
    versus intrathecal baclofen versus orthopaedic surgery, or which will be worse
    off after a permanent neurosurgical procedure. **Decisions that permanently
    alter a child's body are made on clinical judgement over a heterogeneous
    population.**
    **AND THERE IS A FOURTH MEASUREMENT PROBLEM THAT THIS BLOCK HAS NO ROOM FOR**
    (gaps.md #209). Roughly a quarter of people with cerebral palsy have severe
    speech impairment, and many more have unreliable hand control. Standard
    cognitive assessment requires speech or pointing. **So intelligence is
    systematically underestimated in exactly the people who cannot demonstrate
    it**, with consequences — educational placement, expectations, autonomy — that
    last a lifetime. The same applies to pain, which is assessed by self-report and
    is therefore under-recorded in the people most likely to have it. These are
    failures to measure the **person**, and `diagnostic`, `prognostic` and
    `predictive` are all about the disease.

toll:
  severity: major
  permanent: true
  what: >
    **THE SURGERY IS IRREVERSIBLE AND THE EVIDENCE UNDER IT IS THINNER THAN THE
    CONSENT CONVERSATION IMPLIES.**
    **Selective dorsal rhizotomy** permanently divides sensory nerve rootlets to
    reduce spasticity. It works, it cannot be undone, and it is performed on
    children whose adult function nobody can predict — some adults report late
    weakness and pain. **Single-event multilevel orthopaedic surgery** —
    osteotomies, tendon transfers and lengthenings in one operation — is major
    surgery followed by months of rehabilitation, and a minority end with worse
    function than they started. **Intrathecal baclofen pumps** carry infection,
    catheter failure and a withdrawal syndrome that can be life-threatening.
    Repeated **botulinum toxin** raises questions about long-term muscle atrophy
    that are not settled.
    **AND THERE IS A TOLL THIS SCHEMA HAS NO FIELD FOR AT ALL: THE CHILDHOOD.**
    Children with cerebral palsy have historically spent thousands of hours in
    therapy, much of it in approaches that were never tested and some of which
    were later shown to do nothing — passive stretching, neurodevelopmental
    handling, patterning regimes that required families to recruit volunteers for
    daily sessions. **That is a decade of a child's life spent on treatment, and
    the register's `toll` counts only what the treatment did to the body.** The
    hours are gone either way.
    Add the marketing of unproven stem cell therapies to families who travel and
    pay for them, which is a documented harm with no benefit and no regulator
    reaching it.
  incidence:
    value: 0.05
    units: >
      fraction-of-treated (permanent harm — chiefly worse function or late pain
      after irreversible neurosurgical or orthopaedic intervention, and pump
      complications) — a reasoned estimate
    src: reasoning

window:
  what: >
    **TWO WINDOWS AND THEY ARE ON OPPOSITE SIDES OF THE EVENT.**
    **Before and during birth, the window is hours, and everything in it is
    prevention.** Antenatal magnesium sulphate given to a woman in preterm labour
    reduces cerebral palsy in the surviving infant; antenatal corticosteroids
    mature the lung and reduce the intraventricular haemorrhage that leads to it;
    **therapeutic hypothermia must start within six hours** of a hypoxic-ischaemic
    insult at term; and phototherapy for severe neonatal jaundice prevents
    kernicterus outright. Each of these is cheap, each is on a clock, and **each
    is delivered to someone who is not yet the patient and may never be one.**
    **After birth the window is neuroplasticity, and it is the one being missed.**
    The developing brain reorganises most in the first two years, so
    goal-directed, activity-based intervention started early is worth more than
    the same intervention started at three. **The historical average age at
    diagnosis was around nineteen months** — most of the window, spent waiting for
    milestones to fail. Tools now available identify high-risk infants by three
    to six months, and are used in a minority of services.
    **What does not close is the entity.** The lesion is finished and the window
    for repairing it never existed. What the second window governs is how much
    function is built around it, which is a different kind of deadline than
    anything else in this register (gaps.md #208).
    **And a third clock nobody names: hip displacement.** In the more severely
    affected, the hip migrates progressively out of the socket over childhood; a
    dislocated hip is painful and irreversible; and **radiographic surveillance
    on a schedule catches it in time.** Sweden's national programme reduced
    dislocation from roughly one in twelve to near zero. That is a window with a
    documented, cheap, boring solution.
  closes_on: >
    the six hours after a hypoxic-ischaemic insult, and the hours of preterm
    labour, for prevention; and the first two years of peak neuroplasticity for
    building function afterwards — the lesion itself is finished before either
  caught_in_time:
    value: 0.25
    units: >
      fraction-of-cases (perinatal neuroprotection delivered where indicated, or
      diagnosis and goal-directed early intervention starting inside the first two
      years) — a reasoned estimate, and generous outside high-income settings
    src: reasoning

