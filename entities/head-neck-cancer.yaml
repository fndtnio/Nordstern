    intervention: curative
    efficacy:
      value: 0.40
      units: fraction-of-stratum (alive and disease-free at five years)
      src: reasoning
    toll: catastrophic
    what: >
      **THE LARGEST STRATUM, AND WHERE THE WHOLE OF THIS RECORD'S TOLL LIVES.**
      Surgery and chemoradiation together, or chemoradiation with salvage surgery
      held in reserve. Cure in roughly four of ten, and the survivors are the
      people in the `toll` block — the laryngectomies, the feeding tubes, the
