# THE SEVENTEENTH CANCER IN THIS CORPUS AND THE FIRST WHERE THE TREATMENT TAKES
# EATING, SPEAKING AND THE FACE.
#
# `pleomorphic-adenoma` is in this register because a benign salivary tumour can
# cost a facial nerve, and that record exists to make the point that "cured" is
# not a description of what happened to the patient. **This is the same argument
# at fifty times the scale**, in a disease that kills roughly 365,000 people a
# year.
#
# IT IS ALSO TWO DISEASES WEARING ONE NAME, AND THEY ARE MOVING IN OPPOSITE
# DIRECTIONS. Tobacco-and-alcohol disease is falling wherever smoking has
# fallen. **HPV-positive oropharyngeal cancer is rising**, in younger men, in
# exactly the countries where the other half is declining — and it is
# **preventable by a vaccine this register already holds in `cervical-cancer`**.
# One record, two causes, two trends, two prevention levers, and roughly 80%
# five-year survival against 45%.
#
# NASOPHARYNGEAL CARCINOMA IS DELIBERATELY NOT HERE. It is Epstein-Barr virus
# rather than HPV or tobacco, radiotherapy rather than surgery, concentrated in
# southern China, South-East Asia and the Maghreb rather than everywhere, and it
# has a blood test that works. Filing it here would average a surgical disease
# into a radiotherapeutic one and hide the geography — gaps.md #4. It gets its
# own record.

burden:
  cases:
    value: 7.5e5
    units: >
      new cases/year across the lip and oral cavity, oropharynx, larynx and
      hypopharynx — **a sum across subsites rather than a single published
      figure**, which is why the number is soft. Collectively the group is
      usually placed sixth or seventh among cancers worldwide. **Nasopharynx is
      excluded** and is a separate record
    src: recall
  deaths:
    value: 3.6e5
    units: >
      deaths/year across the same subsites, approximately. Oral cavity carries
      the largest share, driven by South and South-East Asia where **betel quid
      and areca nut** are chewed at population scale
    src: recall
  note: >
    **THE INCIDENCE OF THIS RECORD IS TWO CURVES CROSSING.** Tobacco-driven
    disease is falling across high-income countries in step with smoking.
    **HPV-positive oropharyngeal cancer has risen steeply over three decades**,
    predominantly in men, to the point where in several countries it now exceeds
    cervical cancer in incidence — a fact that surprises almost everyone,
    including clinicians, because the vaccine was introduced as a girls'
    programme.

survival:
  horizon: 5 years from diagnosis
  untreated:
    value: 0.05
    units: fraction alive — untreated squamous carcinoma of the upper aerodigestive tract
    src: reasoning
  treated:
    value: 0.55
    units: >
      fraction alive on best available treatment, blended across a record that
      `spans_ladder` — roughly 0.80 for HPV-positive oropharyngeal disease and
      roughly 0.45 for tobacco-and-alcohol disease
    src: recall
  witness: >
    **A "GOOD CHANCE" RECORD WHOSE TOLL IS `catastrophic`, WHICH IS THE ARGUMENT
    FOR KEEPING THESE AXES APART.** Fifty-five percent survive five years; a large
    share of them do so without a larynx, without saliva, or with a feeding tube.
    **`survival` answers "do I live" and says nothing about "as what"** — `toll`,
    `residue` and `restored` carry that, and a dashboard showing survival alone
    would report this record as a success.

axes:
  mechanism: established
  intervention: curative
  prevention: prophylaxis
  ongoing: moderate
  efficacy:
    value: 0.55
    units: >
      fraction-of-patients (alive and free of disease at five years on best
      available treatment) — **a blend of two very different diseases**: around
      0.80 for HPV-positive oropharyngeal cancer and around 0.45 for
      tobacco-and-alcohol disease, which is one of the widest prognostic splits
      inside a single record in this corpus
    src: reasoning
  access:
    value: 0.35
    units: >
      fraction-of-patients (reaching curative-intent treatment with the surgery,
      radiotherapy, reconstruction and rehabilitation it requires) — **this is
      not a drug, it is a service**, and the service is a head and neck surgeon,
      a radiotherapy machine, a reconstructive team, a speech and swallowing
      therapist and a dentist, in the same institution
    src: reasoning

measurement:
  diagnostic: objective
  prognostic: good
  predictive: partial
  witness: >
    **DIAGNOSTIC IS `objective` AND THE PROBLEM IS NOT THE TEST, IT IS THAT
    NOBODY LOOKED.** Diagnosis is a biopsy, and **p16 immunohistochemistry** — a
    cheap, routine stain — serves as the surrogate for HPV status and decides
    which of the two diseases the patient has. There is no diagnostic ambiguity
    worth arguing about once a specimen exists.
    **The specimen is the problem.** Oral cavity cancer is *visible*. It sits on
    a tongue or a gum, in a mouth that a dentist or a nurse can look into with a
    torch, and it is routinely diagnosed at stage III or IV. **This register
    contains no other cancer that can be seen with the naked eye and is still
    caught late**, and it makes the `window` below the cheapest thing here.
    PROGNOSTIC is `good`, and unusually so: **HPV status is one of the strongest
    single prognostic markers in oncology.** It is so strong that in 2017 the
    staging system was rebuilt around it — HPV-positive oropharyngeal cancer was
    given **its own separate staging**, because the existing stages no longer
    predicted survival for those patients. A stage IV under the old system was
    frequently a stage I under the new one, with no change to the patient.
    PREDICTIVE is `partial`. HPV status predicts radiosensitivity. **PD-L1
    combined positive score selects who benefits from pembrolizumab** in
    recurrent and metastatic disease, which is a real biomarker doing real work.
    **What is not predicted is the decision that matters most** — surgery or
    radiotherapy first, for a patient in whom either might cure and the two take
    completely different things away. That choice is made on institutional
    culture as much as on evidence, and it decides whether somebody keeps their
    larynx.

toll:
  severity: catastrophic
  permanent: true
  what: >
    **THIS RECORD'S TOLL IS EATING, SPEAKING AND THE FACE — THE THREE THINGS
    THAT CONSTITUTE BEING A PERSON IN A ROOM WITH OTHER PEOPLE.**
    **Surgery** may take part of the tongue, part of the mandible, or the larynx
    entirely. A total laryngectomy means a **permanent stoma in the neck, no
    voice**, and breathing through a hole for the rest of a life. Free-flap
    reconstruction rebuilds the jaw from the fibula and the result is
    functional, not invisible.
    **Radiotherapy takes the saliva, permanently.** The salivary glands do not
    recover, so **xerostomia** is for life: eating requires water with every
    mouthful, taste is altered, the teeth decay and are often removed
    prophylactically before treatment begins, and **osteoradionecrosis of the
    mandible** — irradiated bone that dies and will not heal — is the
    complication everybody in the field fears. Add fibrosis, trismus,
    hypothyroidism, and carotid stenosis a decade later.
    **Dysphagia is the one that kills.** Long-term feeding-tube dependence, and
    aspiration into irradiated lungs, and the register records those deaths as
    pneumonia.
    **THE FIELD HAS SPENT TWENTY YEARS TRYING TO REDUCE THIS TOLL AND THE MOST
    IMPORTANT RESULT WAS A FAILURE.** HPV-positive patients are young, do well,
    and live for decades with what treatment took — so replacing cisplatin with
    the gentler cetuximab was the obvious de-escalation. **Two randomised trials
    reported in 2019 and both found worse survival with cetuximab**, without a
    meaningful reduction in toxicity. A serious, well-motivated attempt to give
    people their swallowing back cost some of them their lives, and it is the
    reason de-escalation is now done cautiously and inside trials.
  incidence:
    value: 0.25
    units: >
      fraction-of-treated (**catastrophic** permanent harm — loss of voice after
      laryngectomy, long-term feeding-tube dependence, osteoradionecrosis,
      disfiguring resection) — a reasoned estimate, concentrated in the locally
      advanced stratum.
      **The layer beneath it is much larger and this field cannot hold two.**
      Permanent xerostomia is close to universal after radiotherapy to these
      fields, and dysphagia of some degree affects a majority — `major` harm at
      perhaps 0.60, sitting under a `catastrophic` harm at 0.25. SCHEMA.md says
      severity describes the harm *when it happens* and incidence carries how
      often, which is right and means **a treatment with two distinct permanent
      tolls at two severities can only report one of them**
    src: reasoning

window:
  what: >
    **A CANCER YOU CAN SEE WITH A TORCH, DIAGNOSED AT STAGE IV.**
    Stage at diagnosis dominates everything in this record: early-stage disease
    is cured by single-modality treatment with a modest toll, and locally
    advanced disease needs surgery *and* chemoradiation and takes the whole of
    the `toll` block above. **The gap between those two is the difference between
    a scar and a laryngectomy.**
    And a large share of this disease is **visible or palpable months before
    anybody acts on it**. An ulcer on the tongue that has not healed in three
    weeks, a lump in the neck, a hoarse voice that persists, a loose tooth with
    no dental cause. The people best placed to find it are **dentists, dental
    hygienists and primary care**, not oncologists, and the delay is typically
    split between the patient not presenting and the first clinician not
    referring.
    **The second window is prophylactic and it closes in adolescence.** HPV
    vaccination prevents the infection that causes the rising half of this
    record, and it must be given before exposure. **Boys were excluded from most
    national programmes for a decade** — see `prevention` — which means a cohort
    of men now in their twenties was left unprotected against a cancer that
    predominantly affects men.
    A third, quieter one: **field cancerisation.** Tobacco and alcohol damage the
    whole upper aerodigestive mucosa, so a cured patient carries a persistent
    risk of a second primary tumour of a few percent per year, indefinitely.
    Stopping smoking after diagnosis measurably reduces it, and is asked about
    far less often than it should be.
  closes_on: >
    progression from early-stage disease curable by one modality to locally
    advanced disease requiring surgery and chemoradiation together — months, in a
    cancer that is frequently visible throughout; and separately, HPV exposure in
    adolescence, after which the vaccine cannot help
  caught_in_time:
    value: 0.40
    units: >
      fraction-of-cases (diagnosed at a stage curable with single-modality
      treatment) — a reasoned estimate, and markedly worse for oral cavity
      cancer in South Asia than for laryngeal cancer in Europe
    src: reasoning

strata:
  - name: HPV-positive oropharyngeal
    fraction:
      value: 0.20
      units: fraction-of-people-with-head-and-neck-cancer
      src: reasoning
    intervention: curative
    efficacy:
      value: 0.80
      units: fraction-of-stratum (alive and disease-free at five years)
      src: reasoning
    toll: major
    what: >
      **A DIFFERENT DISEASE THAT HAPPENS IN THE SAME PLACE.** Caused by HPV16,
      predominantly in the tonsil and base of tongue, in men who are younger and
      often never smoked. The tumours are radiosensitive, the survival is around
      80%, and the staging system was rebuilt in 2017 to stop calling them stage
      IV. **The share is rising steeply and is the reason this record's incidence
      is not falling with tobacco.** It is also the stratum that is preventable
      outright by a vaccine.

  - name: HPV-negative, early stage
    fraction:
      value: 0.25
      units: fraction-of-people-with-head-and-neck-cancer
      src: reasoning
    intervention: curative
    efficacy:
      value: 0.70
      units: fraction-of-stratum (alive and disease-free at five years)
      src: reasoning
    toll: major
    what: >
      Tobacco, alcohol and betel quid disease caught before it needs everything.
      **Single-modality treatment — surgery or radiotherapy — cures most of
      them**, and the toll, while real, is a fraction of what the next stratum
      pays. Everything in `window` is about moving patients into this row.

  - name: HPV-negative, locally advanced
    fraction:
      value: 0.40
      units: fraction-of-people-with-head-and-neck-cancer
