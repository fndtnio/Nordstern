slug: osteoporosis
id: FND-D-0101
name: osteoporosis
also: [osteopenia, fragility fracture, postmenopausal osteoporosis, low bone density, brittle bones, glucocorticoid-induced osteoporosis]
common: brittle bones
mondo: MONDO:0005298
kind: disease
residual: false
contested: true

# gaps.md #179 NAMED THIS RECORD BEFORE IT EXISTED. Its table of entities that
# are a number rather than a disease reads: *"osteoporosis (not held) | bone
# density | fracture"*. That was written at `hypertension` and it is exactly
# right — nobody suffers from osteoporosis. They suffer from a hip fracture.
#
# BUT THE REASON TO WRITE THE RECORD IS THE OTHER THING IT CARRIES, AND NOTHING
# ELSE IN THE CORPUS HAS IT TWICE.
#
# **This is a disease whose treatments were abandoned, at population scale, on the
# perception of their harm rather than on its size.** Hormone therapy after 2002
# and bisphosphonates after 2010: two effective, fracture-preventing therapies,
# two rare and vivid adverse effects, two collapses in use of a size that no
# efficacy trial has ever produced in the opposite direction.
#
# The register's `toll` field records severity and incidence — a number. **What
# decides whether a treatment is used is not the number. It is how vivid the harm
# is, and whether it can be pointed at** (gaps.md #212). An atypical femoral
# fracture is rare, dramatic, unmistakably attributable, and named after the drug
# that caused it. The fractures prevented are counterfactuals nobody sees.
#
# It is also `heart-failure`'s #210 with a different engine. There the therapy is
# not given through inertia and diffuse responsibility. **Here it is actively
# stopped, by patients and prescribers both, and they are wrong.**

burden:
  prevalence:
    value: 5.0e8
    units: >
      people with osteoporosis by bone-density criteria, approximately and
      softly — **the figure is a count of people on one side of a statistical
      convention, see `witness.contested`** — of whom the large majority are women
      over fifty. Roughly **nine million fragility fractures a year**, and the
      lifetime risk of one is around one in three for women and one in five for
      men
    src: recall
  deaths:
    value: 0.0
    units: >
      deaths/year attributed — **a sixth kind of zero, and this one is filed under
      the physical event rather than the condition.** Hip fracture carries a
      one-year mortality of roughly 20-30%, and those deaths are counted as
      **falls**, an injury cause. A fall from standing height kills a person with
      osteoporosis and does not kill a person without one; **the fall is recorded
      and the reason the bone broke is not**
    src: reasoning
  note: >
    **THE LOWEST REACH IN THE REGISTER FOR A DISEASE TREATED WITH A CHEAP GENERIC
    TABLET.** The drugs work, cost pennies, are taken weekly, and after a fragility
    fracture — the single clearest indication in the whole of preventive medicine
    — fewer than a quarter of patients are treated, and in many systems fewer
    than one in five. That figure was higher fifteen years ago and fell.

axes:
  mechanism: established
  intervention: suppressive
  prevention: risk-reduction
  ongoing: low
  efficacy:
    value: 0.50
    units: >
      fraction-of-patients (meaningful fracture risk reduction on treatment) —
      **and the units are strained in the way gaps.md #179 predicts for a record
      that is a risk factor.** Bisphosphonates cut vertebral fractures by roughly
      40-70% and hip fractures by around 40%; nobody's fracture is prevented
      individually and nobody knows whose was
    src: reasoning
  access:
    value: 0.15
    units: >
      fraction-of-patients (identified and treated, and still on treatment a year
      later) — **among the lowest figures in this register, for one of its
      cheapest treatments.** Post-fracture treatment rates under a quarter in most
      wealthy systems, persistence at one year around half of those started, and
      DXA scanning largely absent across low- and middle-income countries
    src: reasoning

measurement:
  diagnostic: objective
  prognostic: good
  predictive: none
  witness: >
    **DIAGNOSTIC IS `objective`, THE TEST IS EXCELLENT, AND IT IDENTIFIES A
    MINORITY OF THE PEOPLE WHO WILL FRACTURE.**
    Dual-energy X-ray absorptiometry measures bone mineral density in minutes at
    trivial radiation dose, and the result is expressed as a **T-score** —
    standard deviations below the mean of a young adult reference population.
    Osteoporosis is defined as a T-score of −2.5 or below. **That number was
    chosen by a working group in 1994 as a convention**, and it is #206 and #90 in
    one figure: a cut-point selected for its consequences, applied to a
    distribution derived from a reference population.
    **And the arithmetic of it defeats the purpose.** Fracture risk rises
    continuously as density falls, but there are far more people in the
    *osteopenic* range between −1.0 and −2.5 than below it — so **the majority of
    fragility fractures occur in people who do not meet the diagnostic criteria
    for the disease.** A test that is objective, cheap and accurate correctly
    identifies a group that suffers a minority of the outcome it was built to
    predict.
    PROGNOSTIC is `good`, and it is the field's genuine success. **FRAX** and
    similar calculators combine age, sex, prior fracture, parental hip fracture,
    smoking, glucocorticoid use, rheumatoid arthritis and alcohol — with or
    without a bone density measurement — to give a ten-year absolute probability
    of major fracture. It works, it is free, it runs on a phone, and it moved the
    field from *treating a T-score* to *treating a risk*, exactly as
    cardiovascular risk scores did. **The best prognostic instrument in this
    register that requires no test at all.**
    PREDICTIVE is `none`, and it is the crux of the whole record. Nothing predicts
    who benefits from which drug. **And nothing whatever predicts who will suffer
    the two rare harms — atypical femoral fracture and osteonecrosis of the jaw —
    that stopped this treatment being given** (gaps.md #212). A harm that cannot
    be predicted in an individual cannot be avoided by selection, so the only
    available responses are to accept it or to stop treating everybody. **The
    field largely chose the second.**

toll:
  severity: major
  permanent: true
  what: >
    **THE HARM IS REAL, IT IS PERMANENT, IT IS RARE, AND IT IS THE MOST
    CONSEQUENTIAL THING IN THIS RECORD — NOT BECAUSE OF WHAT IT DID TO THE
    PATIENTS WHO HAD IT, BUT BECAUSE OF WHAT ITS PUBLICITY DID TO EVERYONE ELSE**
    (gaps.md #212).
    **Atypical femoral fracture**: a transverse fracture of the femoral shaft,
    often after prodromal thigh pain, associated with long-duration bisphosphonate
    and denosumab use. It needs surgery, heals slowly, and frequently occurs
    bilaterally. Risk rises with duration of treatment and falls quickly after
    stopping. **Osteonecrosis of the jaw**: exposed necrotic bone, chronic,
    difficult to treat, disfiguring. It is common at the high intravenous doses
    used in cancer and **rare at osteoporosis doses**, on the order of one in
    ten thousand to one in a hundred thousand patient-years.
    **State the balance plainly, because the record turns on it.** For every
    atypical femoral fracture caused, many times more typical fragility fractures
    are prevented; the number needed to harm is in the thousands and the number
    needed to treat is in the tens. **The balance is not close and it is not
    disputed by anybody who has computed it.**
    **Denosumab has a third and stranger toll: you cannot stop it.** Withdrawal
    produces a rebound in bone turnover and a burst of vertebral fractures, in
    some patients to below their pre-treatment state. **So this record contains one
    drug that guidelines say to stop after three to five years, and another that
    must never be stopped without transitioning to something else** — a treatment
    whose discontinuation is worse than never having started, which nothing in
    this schema can express.
    Ordinary tolls too: oesophagitis from oral bisphosphonates, an acute-phase
    reaction after the first intravenous dose, hypocalcaemia.
  incidence:
    value: 0.002
    units: >
      fraction-of-treated (atypical femoral fracture, osteonecrosis of the jaw, or
      rebound vertebral fracture after denosumab withdrawal) — a reasoned
      estimate, weighted toward long-duration use. **The number is small and the
      point of this record is that it did not behave like a small number**
    src: reasoning

residue:
  severity: major
  permanent: true
  what: >
    **THE FRACTURE IS THE DISEASE ARRIVING, AND WHAT IT LEAVES IS THE WHOLE
    BURDEN.**
    **Hip fracture** is the one that matters. Around a fifth to a third of
    patients are dead within a year; of the survivors, **roughly half never regain
    their previous level of function**, and a substantial minority who were living
    independently enter long-term care and do not leave. The bone is fixed
    surgically and heals; the independence does not come back. That is a textbook
    `residue` — an episode that ended, leaving permanent damage in someone the
    treatment worked on.
    **Vertebral fractures are the quiet ones.** Most are never diagnosed, because
    they present as back pain or as nothing. Accumulated, they produce height
    loss, kyphosis, chronic pain, abdominal compression and restrictive
    ventilatory impairment — and **each one roughly quintuples the risk of the
    next**, which is why the `window` below is the sharpest in the corpus.
    **And there is a residue that is not physical.** Fear of falling after a
    fracture reduces activity, which reduces strength and balance, which increases
    fall risk — a self-sustaining loop that has a name in the literature and no
    field here. It is `osteoarthritis`'s deconditioning spiral in a second
    musculoskeletal record.
  incidence:
    value: 0.25
    units: >
      fraction-of-affected (permanent loss of function, independence or spinal
      structure following a fragility fracture) — a reasoned estimate across
      people who sustain one
    src: reasoning

window:
  what: >
    **THE FIRST FRAGILITY FRACTURE IS THE CLEAREST, CHEAPEST, MOST COMPLETELY
    WASTED SIGNAL IN THIS ENTIRE REGISTER.**
    A person who breaks a wrist, a humerus, a vertebra or a pelvis from a fall
    from standing height at sixty-five has announced their diagnosis. They have
    presented to a hospital. They are in the system, on a list, with an X-ray. A
    prior fragility fracture roughly doubles the risk of the next one, the risk is
    highest in the following one to two years — **an "imminent risk" window** —
    and around half of hip fracture patients had an earlier fragility fracture
    that nobody acted on.
    **Fewer than a quarter of them are investigated or treated.**
    **The fix exists, is named, is cheap and is cost-saving.** A Fracture Liaison
    Service systematically identifies everyone over fifty presenting with a
    fracture, assesses them, and starts treatment. Where implemented it raises
    treatment rates several-fold and reduces refractures. It is recommended
    everywhere and implemented patchily, which puts it in the same category as
    `cerebral-palsy`'s hip surveillance and `osteoarthritis`'s joint registries:
    **a boring administrative intervention with better evidence than most drugs.**
    **The second window is bone mass itself and it closes at about thirty.** Peak
    bone mass is attained in early adulthood and everything afterwards is
    withdrawal from that account — so childhood and adolescent nutrition, vitamin
    D and weight-bearing activity set the ceiling for a disease that presents at
    seventy-five. That is `copd`'s gaps.md #96 in a third tissue, after
    `asthma`'s lung-growth window: **a determinative period with nothing to
    diagnose and no patient.**
    **And a third window nobody defends: the menopause.** Bone loss accelerates
    sharply for roughly a decade afterwards, and the intervention that prevents it
    is the one abandoned in 2002.
  closes_on: >
    the second fracture — the one-to-two-year period of imminent risk after a
    first fragility fracture, during which the patient is already in the health
    system and is discharged untreated; and, decades earlier, the attainment of
    peak bone mass in early adulthood
  caught_in_time:
    value: 0.20
    units: >
      fraction-of-cases (assessed and treated after a first fragility fracture) —
      a reasoned estimate, and it is close to the published post-fracture
      treatment rates rather than generous
    src: reasoning

strata:
  - name: primary prevention — low bone density, no prior fracture
    fraction:
      value: 0.75
      units: fraction-of-people-with-osteoporosis
      src: reasoning
    intervention: suppressive
    efficacy:
      value: 0.40
      units: fraction-of-stratum (meaningful absolute risk reduction)
