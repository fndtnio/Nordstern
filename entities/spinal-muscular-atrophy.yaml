  - kind: logistics
    blocks: the pathway that has to run inside a window of weeks
    obstacles: []
    what: >
      Delivering this record's benefit requires, within a few weeks of birth: a
      newborn screening laboratory, a confirmatory genetic test including *SMN2*
      copy number, a specialist neuromuscular centre, a funding decision, and —
      for two of the three drugs — either an intrathecal procedure under sedation
      or an intravenous gene therapy infusion with weeks of hepatic monitoring
      afterwards.
      **Each step is ordinary and the sequence has to complete before the motor
      neurons die.** Where any link is missing the child is treated symptomatically,
      which is a different and much worse intervention delivered with the same drug.
      For the symptomatically affected, the supportive apparatus is its own
      logistics problem: non-invasive ventilation, cough assist devices,
      gastrostomy, powered wheelchairs, spinal surgery, and a multidisciplinary
      clinic — none of which is available in most of the world, and all of which
      determined survival before 2016 and still does for untreated patients.
      This is gaps.md #154 with an unusually short fuse: **an intervention that
      must be operated, correctly, by several services in sequence, in a newborn,
      inside a deadline.**
    who_could: [health-system, government, payer, academic, nonprofit]
